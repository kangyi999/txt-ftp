name: Download and FTP Upload
run-name: Download source then upload to FTP
on:
  schedule:
    # UTC时间，北京时间=UTC+8
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: windows-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run download & upload script
        shell: powershell
        run: .\download_and_upload.ps1
